name: Build iOS IPA (sideload patched)

# 编译狗头军师 iOS（未签名真机包），编译前自动打侧载补丁：
#   修复 Sideloadly + 免费 Apple ID 签名下的钥匙串 -34018，以及 App Group 不可用。
# 补丁脚本：tools/sideload_patch.py

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "唯一 Bundle ID（免费 Apple ID 签名必须用自己的）"
        required: true
        default: "com.3000lumen.goutoujunshi"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/jev_ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Apply sideload patch
        run: python3 "$GITHUB_WORKSPACE/tools/sideload_patch.py"

      - name: Verify patch
        run: |
          grep -n "fallbackStore" Shared/Store.swift | head -n 5
          if grep -q "kSecAttrAccessGroup" Shared/Store.swift; then echo "ERROR: access group still present"; exit 1; fi
          echo "PATCH VERIFIED"

      - name: Build device targets (unsigned)
        run: |
          xcodebuild -project GoutouJunshi.xcodeproj -scheme GoutouJunshi \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            GOUTOU_BUNDLE_ID="${{ github.event.inputs.bundle_id }}" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPA
        run: |
          APP=$(find build-device/Build/Products/Debug-iphoneos -maxdepth 1 -name 'GoutouJunshi.app' -type d | head -n1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "ERROR: app not found"; exit 1; fi
          ls -d "$APP/PlugIns/"*.appex || echo "WARN: no extensions"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r goutoujunshi-ios-sideload.ipa Payload
          ls -la goutoujunshi-ios-sideload.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-ios-sideload
          path: integrations/jev_ios/goutoujunshi-ios-sideload.ipa
          if-no-files-found: error
